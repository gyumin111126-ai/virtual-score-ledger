<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>섯다 장부</title>
<meta property="og:title" content="섯다 장부">
<meta property="og:description" content="가상 점수 기록용 섯다 장부">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="섯다 장부">
<meta name="twitter:description" content="가상 점수 기록용 섯다 장부">
<style>
*{box-sizing:border-box}
:root{--ink:#171717;--muted:#707070;--line:#e7e7e7;--bg:#f5f5f5;--red:#e53935}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #eee}
h1{font-size:25px;margin:0 0 8px;letter-spacing:-.7px}
h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
textarea,input{width:100%;border:1px solid #d7d7dc;border-radius:12px;padding:12px;margin-top:8px;font:inherit;background:#fff}
textarea:focus,input:focus{outline:2px solid #ddd}
textarea{min-height:130px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:750;font:inherit;cursor:pointer}
button:active{transform:scale(.98)}
.primary{background:#111;color:#fff;width:100%;margin-top:12px}
.secondary{background:#efeff2;color:#222}.danger{background:#ffe9e9;color:#b42318}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.player{border:1px solid #e8e8ec;border-radius:16px;padding:13px;margin:11px 0;background:#fff}
.name{font-size:17px;font-weight:850}.score{font-size:22px;font-weight:900;margin-top:3px}
.win{background:#111;color:#fff;min-width:68px}
.lossbox{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.lossbtn{background:#f1f1f4;padding:10px 4px}.lossbtn.active{outline:2px solid #111;background:#dddde3}
.custom{display:flex;gap:8px;margin-top:8px}.custom input{margin:0}.custom button{white-space:nowrap}
.hidden{display:none!important}.badge{font-size:12px;padding:3px 7px;border-radius:999px;background:#eee;margin-left:6px}
.last{background:#ffe8e8;color:#a40000}.hist{padding:11px 0;border-bottom:1px solid #eee}
.topbar{display:flex;gap:8px;margin-top:12px}.topbar button{flex:1}
#loserOverlay{position:fixed;inset:0;z-index:9999;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.loserBox{width:100%;max-width:600px}.loserSmall{font-size:20px;opacity:.75;margin-bottom:18px}
.loserName{font-size:clamp(42px,13vw,90px);font-weight:900;word-break:keep-all}
.loserText{font-size:clamp(48px,15vw,110px);font-weight:1000;margin-top:4px}
.loserCount{font-size:17px;opacity:.7;margin-top:28px}
.rankItem{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #eee;gap:12px}
.rankNum{width:42px;height:42px;border-radius:50%;background:#f1f1f4;display:grid;place-items:center;font-weight:900}
.rankName{font-weight:850;font-size:17px}.rankScore{margin-left:auto;font-size:18px;font-weight:900}
.check{display:flex;align-items:center;gap:9px;margin:16px 0 4px;font-size:14px;font-weight:700}
.check input{width:18px;height:18px;margin:0}
@media(max-width:520px){.topbar{flex-direction:column}.lossbox{grid-template-columns:repeat(2,1fr)}}
/* 개발자 소개 페이지 */
.dev-link{width:100%;margin-top:10px;background:#f1f1f4;color:#444;font-size:13px}
.dev-page{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}
.dev-card{text-align:center;padding:28px 18px}
.dev-title{font-size:24px;font-weight:900;margin:0 0 18px}
.dev-image{width:min(280px,78vw);aspect-ratio:1/1;object-fit:cover;border-radius:20px;display:block;margin:0 auto 16px;border:1px solid #eee}
.dev-name{font-size:12px;color:var(--muted);margin:0 0 22px;letter-spacing:.2px}
.back-btn{width:100%;background:#111;color:#fff}
</style>
</head>
<body>
<div class="wrap">

<div class="card" id="setup">
<h1>가상 점수 장부</h1>
<div class="muted">실제 돈이 아닌 가상 점수용</div>
<h2 style="margin-top:18px">참가자 이름</h2>
<textarea id="names" placeholder="철수&#10;민수&#10;영희&#10;준호"></textarea>
<h2 style="margin-top:16px">1인당 시작 점수</h2>
<input id="startScore" type="number" min="0" step="100" value="1000">
<button class="primary" id="startBtn">게임 시작</button>
<button type="button" class="dev-link" id="devBtn">개발자 정보</button>
</div>

<div class="muted">진 사람 차감 점수를 고르고, 이긴 사람의 <b>승</b>을 누르세요. 보유 점수보다 큰 금액을 입력하면 올인(현재 점수 전부 차감)으로 처리됩니다.</div>
<div id="players"></div>
</div>
<div class="card"><h2>최근 판 기록</h2><div id="history" class="muted"></div></div>
</div>

<div class="card hidden" id="final">
<h1>🏆 최종 전체 순위</h1>
<div class="muted">이번 게임의 최종 결과입니다.</div>
<div id="finalRank" style="margin-top:10px"></div>
<label class="check"><input type="checkbox" id="reuse" checked> 이전 참가자와 시작 점수 그대로 다시 플레이</label>
<button class="primary" id="newBtn">다음 게임 준비</button>
</div>
</div>

<script>
const KEY="virtualScoreLedgerV2";
let state={started:false,ended:false,round:1,players:[],history:[],pending:{},settings:null};
const $=s=>document.querySelector(s);

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x && typeof x==="object"){
    state={...state,...x};
  }
  if(!Array.isArray(state.players)) state.players=[];
  if(!Array.isArray(state.history)) state.history=[];
  if(!state.pending || typeof state.pending!=="object") state.pending={};
  if(!state.settings || typeof state.settings!=="object") state.settings=null;
 }catch(e){
  state={started:false,ended:false,round:1,players:[],history:[],pending:{},settings:null};
 }
}
function ranks(){return [...state.players].sort((a,b)=>b.score-a.score)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function render(){
 $("#developerPage")?.classList.add("hidden");
 $("#setup").classList.toggle("hidden",state.started&&!state.ended);
 $("#game").classList.toggle("hidden",!state.started||state.ended);
 $("#final").classList.toggle("hidden",!state.ended);
 if(state.started&&!state.ended) renderGame();
 if(state.ended) renderFinal();
}

function renderGame(){
 $("#roundLabel").textContent=state.round+"판 입력 중";
 $("#totalLabel").textContent="전체 점수 합계: "+state.players.reduce((s,p)=>s+p.score,0).toLocaleString();
 const rm={};ranks().forEach((p,i)=>rm[p.id]=i+1);
 $("#players").innerHTML="";
 state.players.forEach(p=>{
  const loss=Number(state.pending[p.id]||0);
  const d=document.createElement("div");d.className="player";
  d.innerHTML=`<div class="row"><div class="grow"><div class="name">${esc(p.name)} ${p.score<=0?'<span class="badge last">꼴등</span>':`<span class="badge">${rm[p.id]}위</span>`}</div><div class="score">${p.score.toLocaleString()}</div></div><button class="win" data-win="${p.id}">승</button></div>
  <div class="lossbox">${[100,200,500,1000].map(v=>`<button class="lossbtn ${loss===v?'active':''}" data-loss="${p.id}" data-v="${v}">-${v}</button>`).join("")}</div>
  <div class="custom"><input type="number" min="0" step="100" placeholder="직접 입력" data-in="${p.id}"><button class="secondary" data-set="${p.id}">적용</button><button class="danger" data-allin="${p.id}">올인</button></div>
  <div class="muted" style="margin-top:8px">이번 판 차감: ${loss?'-'+loss.toLocaleString():'없음'}</div>`;
  $("#players").appendChild(d);
 });
 document.querySelectorAll("[data-loss]").forEach(b=>b.onclick=()=>{
  const id=b.dataset.loss,v=+b.dataset.v;
  state.pending[id]=state.pending[id]===v?0:v;save();renderGame();
 });
 document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
  const id=b.dataset.set,i=document.querySelector(`[data-in="${id}"]`);
  state.pending[id]=Math.max(0,+i.value||0);save();renderGame();
 });
 document.querySelectorAll("[data-allin]").forEach(b=>b.onclick=()=>{
   const id=b.dataset.allin;
   const p=state.players.find(x=>x.id===id);
   if(!p) return;
   state.pending[id]=Math.max(0,p.score); // 현재 보유 금액만 올인
   save();renderGame();
 });
 document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>settle(b.dataset.win));
 renderHistory();
}

function settle(wid){
 const w=state.players.find(p=>p.id===wid);
 let pot=0,changes={};
 state.players.forEach(p=>{
  if(p.id!==wid){
   const l=Math.max(0,+state.pending[p.id]||0);
   if(l){changes[p.id]=-l;pot+=l}
  }
 });
 if(!pot){alert("다른 참가자의 차감 점수를 먼저 입력해 주세요.");return}
 changes[wid]=pot;
 state.players.forEach(p=>{if(changes[p.id])p.score+=changes[p.id]});
 state.history.unshift({round:state.round,winnerId:wid,winnerName:w.name,changes});
 state.pending={};state.round++;save();

 const losers=state.players.filter(p=>p.score<=0);
 if(losers.length){
  announceLoser(losers.sort((a,b)=>a.score-b.score)[0]);
 }else{
  renderGame();
 }
}

function renderHistory(){
 $("#history").innerHTML=state.history.length
 ?state.history.map(r=>`<div class="hist"><b>${r.round}판 - ${esc(r.winnerName)} 승</b><br>${state.players.filter(p=>r.changes[p.id]!==undefined).map(p=>`${esc(p.name)} ${r.changes[p.id]>0?'+':''}${r.changes[p.id].toLocaleString()}`).join(" · ")}</div>`).join("")
 :"아직 기록이 없습니다.";
}

function undo(){
 const r=state.history.shift();
 if(!r){alert("취소할 판이 없습니다.");return}
 state.players.forEach(p=>{if(r.changes[p.id])p.score-=r.changes[p.id]});
 state.round=Math.max(1,state.round-1);state.pending={};save();renderGame();
}

function start(){
 const ns=$("#names").value.split("\n").map(x=>x.trim()).filter(Boolean);
 const s=Math.max(0,+$("#startScore").value||0);
 if(ns.length<2){alert("참가자를 2명 이상 입력해 주세요.");return}
 if(new Set(ns).size!==ns.length){alert("참가자 이름이 중복됩니다.");return}
 state={
  started:true,ended:false,round:1,
  players:ns.map((n,i)=>({id:"p"+Date.now()+"_"+i,name:n,score:s})),
  history:[],pending:{},settings:{names:ns,startScore:s}
 };
 save();render();
}

/* 게임 종료 버튼: 항상 최종 순위 화면으로 전환 */
function endGame(){
 // 중간 종료: 확인창 없이 즉시 최종 순위로 이동
 if(!state.started || state.ended) return;
 state.ended=true;
 state.pending={};
 save();
 render();
 // 혹시 렌더링 상태가 꼬여도 최종 화면을 강제로 표시
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("game").classList.add("hidden");
 document.getElementById("final").classList.remove("hidden");
 renderFinal();
 window.scrollTo({top:0,behavior:"instant"});
}

function announceLoser(player){
 state.ended=true;
 state.pending={};
 save();

 const old=document.getElementById("loserOverlay");
 if(old) old.remove();

 const overlay=document.createElement("div");
 overlay.id="loserOverlay";
 overlay.innerHTML=`
  <div class="loserBox">
   <div class="loserSmall">이번 게임 종료</div>
   <div class="loserName">${esc(player.name)}</div>
   <div class="loserText">꼴등</div>
   <div class="loserCount">3초 뒤 전체 플레이어 순위</div>
  </div>`;
 document.body.appendChild(overlay);

 let sec=3;
 const count=overlay.querySelector(".loserCount");
 const timer=setInterval(()=>{
  sec--;
  count.textContent=sec>0?sec+"초 뒤 전체 플레이어 순위":"최종 순위 표시";
 },1000);

 setTimeout(()=>{
  clearInterval(timer);
  overlay.remove();
  render(); // ★ 핵심: 게임 종료 + 전체 순위 화면 표시
 },3000);
}

function renderFinal(){
 $("#finalRank").innerHTML=ranks().map((p,i)=>{
  const medal=i===0?"👑":i===1?"🥈":i===2?"🥉":(i+1)+"위";
  return `<div class="rankItem"><div class="rankNum">${medal}</div><div class="rankName">${esc(p.name)}</div><div class="rankScore">${p.score.toLocaleString()}점</div></div>`;
 }).join("");
}

function newGame(){
 const reuse=$("#reuse").checked;
 const settings=state.settings;
 if(reuse&&settings){
  $("#names").value=settings.names.join("\n");
  $("#startScore").value=settings.startScore;
 }else{
  $("#names").value="";
  $("#startScore").value=1000;
 }
 state={started:false,ended:false,round:1,players:[],history:[],pending:{},settings:reuse?settings:null};
 save();render();
}

$("#startBtn").addEventListener("click",start);
$("#undoBtn").addEventListener("click",undo);
// 게임 종료: 모바일 터치/클릭 모두 강제로 처리
const endButton=$("#endBtn");
let endingLock=false;
function forceEnd(e){
 if(e){ e.preventDefault(); e.stopPropagation(); }
 if(endingLock) return;
 endingLock=true;
 endGame();
 setTimeout(()=>endingLock=false,300);
}
endButton.addEventListener("pointerup",forceEnd,true);
endButton.addEventListener("click",forceEnd,true);
endButton.addEventListener("touchend",forceEnd,{capture:true,passive:false});
// 혹시 버튼 자체 이벤트가 막혀도 문서 단계에서 잡기
document.addEventListener("click",function(e){
 if(e.target && e.target.closest && e.target.closest("#endBtn")) forceEnd(e);
},true);
$("#newBtn").addEventListener("click",newGame);

// 첫 화면 맨 아래 개발자 정보 페이지 이동
$("#devBtn").addEventListener("click",()=>{
 $("#setup").classList.add("hidden");
 $("#developerPage").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"auto"});
});
$("#backBtn").addEventListener("click",()=>{
 $("#developerPage").classList.add("hidden");
 $("#setup").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"auto"});
});

load();render();
</script>
</body>
</html>
